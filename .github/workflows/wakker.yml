# Houdt het Supabase-project wakker.
#
# Een gratis project pauzeert na zeven dagen zonder verkeer, en bij het
# herstellen kwam de database een keer leeg terug. Deze taak doet elke drie
# dagen één aanroep — genoeg om de teller terug te zetten.
#
# Hij roept get_participant aan met een token dat niet bestaat, en verwacht
# 'invalid_token' terug. Dat lijkt omslachtig, maar het is met opzet:
#
#   · Het vraagt niets van de database dat er niet toch al moet staan. Een
#     eigen ping-functie moest handmatig geïnstalleerd worden, en die stap bleef
#     liggen — waarna deze taak negen dagen lang 404 gaf.
#   · Het loopt over precies het pad dat een deelnemer ook loopt: de functie
#     draait, doet een query op participants, en wijst het token af. Gaat dat
#     stuk, dan is de app stuk, en dan wil je het horen.
#
# Let op: GitHub zet geplande taken zelf uit in een repository waar zestig dagen
# niets is gebeurd. Er komt dan een mail. Eén druk op 'Enable workflow' zet hem
# weer aan; ga je hier maanden niet meer heen, exporteer dan de CSV.
name: Supabase wakker houden

on:
  schedule:
    - cron: '17 6 */3 * *'   # elke drie dagen, 6:17 UTC — niet op het hele uur,
                             # want daar staat de rij bij GitHub het langst
  workflow_dispatch:

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Database aantikken
        env:
          URL: ${{ vars.VITE_SUPABASE_URL }}
          KEY: ${{ vars.VITE_SUPABASE_ANON_KEY }}
        run: |
          if [ -z "$URL" ] || [ -z "$KEY" ]; then
            echo "::error::VITE_SUPABASE_URL of VITE_SUPABASE_ANON_KEY ontbreekt in de repository variables"
            exit 1
          fi

          # Geen --fail-with-body: een afgewezen token is hier het goede
          # antwoord, en dat komt terug als HTTP 400.
          antwoord=$(curl -sS -m 30 \
            -X POST "$URL/rest/v1/rpc/get_participant" \
            -H "apikey: $KEY" -H "Authorization: Bearer $KEY" \
            -H "Content-Type: application/json" \
            -d '{"p_token":"wakker-houden-geen-echt-token"}')
          echo "$antwoord"

          case "$antwoord" in
            *invalid_token*)
              echo "Database is wakker en wees het token af." ;;
            *PGRST202*)
              echo "::error::get_participant bestaat niet — draai supabase/schema.sql opnieuw"
              exit 1 ;;
            "")
              echo "::error::Geen antwoord. Staat het project op pauze?"
              exit 1 ;;
            *)
              echo "::error::Onverwacht antwoord, zie hierboven"
              exit 1 ;;
          esac
