<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=Space+Grotesk:wght@500;700&family=Space+Mono:wght@400;700&display=swap">
  <style>
    body { margin: 0; font-family: Inter, system-ui, sans-serif; }
    a { color: #3DFFD2; } a:hover { color: #ECE6DF; }
    .cel { cursor: pointer; }
  </style>
</helmet>

<div style="width: 1000px; height: 800px; background: #15141A; color: #ECE6DF; display: flex; flex-direction: column; overflow: hidden;">

  <div style="display: flex; align-items: center; gap: 16px; padding: 14px 28px; border-bottom: 1px solid #2E2C36; font-family: 'Space Mono', monospace; font-size: 11px; letter-spacing: .1em; text-transform: uppercase; color: #9A958E;">
    <span style="color: #ECE6DF;">COA · UX-TEAM</span>
    <span>/</span>
    <span>SANNE</span>
    <span style="flex: 1;"></span>
    <span>REC 06/20</span>
    <span style="width: 7px; height: 7px; border-radius: 50%; background: #3DFFD2; display: inline-block;"></span>
  </div>

  <div style="flex: 1; display: grid; grid-template-columns: minmax(0, 1fr) 250px; gap: 0; min-height: 0;">

    <div style="padding: 24px 28px; overflow: hidden;">
      <div style="display: flex; align-items: baseline; gap: 12px; margin-bottom: 4px;">
        <h1 style="margin: 0; font-family: 'Space Grotesk', sans-serif; font-size: 27px; font-weight: 700; letter-spacing: -.02em;">Waar sta je nu?</h1>
      </div>
      <p style="margin: 0 0 20px; font-family: 'Space Mono', monospace; font-size: 11px; letter-spacing: .1em; text-transform: uppercase; color: #837E76;">STAP 1 VAN 2 · 10 ASSEN · SCHAAL 1&ndash;5</p>

      <div style="display: grid; grid-template-columns: 1fr; gap: 2px; font-family: 'Space Mono', monospace; font-size: 12px;">
        <div style="display: grid; grid-template-columns: 168px repeat(5, 34px) 1fr; gap: 6px; align-items: center; padding: 0 0 7px; color: #837E76; font-size: 10px; letter-spacing: .12em;">
          <span>AS</span>
          <span style="text-align: center;">1</span>
          <span style="text-align: center;">2</span>
          <span style="text-align: center;">3</span>
          <span style="text-align: center;">4</span>
          <span style="text-align: center;">5</span>
          <span style="padding-left: 10px;">EENHEID WERK</span>
        </div>

        <sc-for list="{{rijen}}" as="rij" hint-placeholder-count="10">
          <div style="display: grid; grid-template-columns: 168px repeat(5, 34px) 1fr; gap: 6px; align-items: center; padding: 5px 0; border-top: 1px solid #232229;">
            <span style="color: {{rij.naamKleur}}; font-size: 12px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap;">{{rij.naam}}</span>
            <sc-for list="{{rij.cellen}}" as="cel" hint-placeholder-count="5">
              <span class="cel" onClick="{{cel.kies}}" style="height: 22px; display: grid; place-items: center; background: {{cel.bg}}; color: {{cel.fg}}; border: 1px solid {{cel.rand}}; border-radius: 3px; font-size: 11px;">{{cel.teken}}</span>
            </sc-for>
            <span style="padding-left: 10px; color: #615D66; font-size: 10.5px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap;">{{rij.anker}}</span>
          </div>
        </sc-for>
      </div>
    </div>

    <div style="border-left: 1px solid #2E2C36; padding: 24px 20px; font-family: 'Space Mono', monospace; font-size: 11px; color: #9A958E; display: flex; flex-direction: column; gap: 18px;">
      <div>
        <div style="letter-spacing: .12em; font-size: 10px; color: #837E76; margin-bottom: 10px;">UITDRAAI</div>
        <sc-for list="{{balken}}" as="b" hint-placeholder-count="10">
          <div style="display: flex; align-items: center; gap: 8px; margin-bottom: 5px;">
            <span style="width: 42px; color: #615D66; font-size: 9.5px;">{{b.code}}</span>
            <span style="color: #3DFFD2; letter-spacing: -1px;">{{b.nu}}</span>
            <span style="color: #E0A83D; letter-spacing: -1px;">{{b.doel}}</span>
          </div>
        </sc-for>
      </div>
      <div style="margin-top: auto; border-top: 1px solid #2E2C36; padding-top: 14px; line-height: 1.7;">
        <div style="color: #3DFFD2;">&#9608;&#9608;&#9608; NU</div>
        <div style="color: #E0A83D;">&#9617;&#9617;&#9617; DOEL</div>
      </div>
    </div>

  </div>
</div>
</x-dc>

<script data-dc-script data-props='{}'>
class Component extends DCLogic {
  constructor(props) {
    super(props);
    this.state = { scores: { 0: 2, 1: 3, 2: 1, 3: 3, 4: 4, 5: 2 } };
  }
  renderVals() {
    const assen = [
      ['Kwalitatief onderzoek', 'KWAL', 'een testronde met een handvol deelnemers'],
      ['Kwantitatief onderzoek', 'KWAN', 'een vragenlijst, van vraag tot conclusie'],
      ['Informatiearchitectuur', 'INFA', 'een structuur ontwerpen en toetsen'],
      ['Interaction Design', 'IXDE', 'een flow met lege, fout- en laadstates'],
      ['UI Design', 'UIDE', 'een scherm dat het designsysteem volgt'],
      ['Prototyping', 'PROT', 'een prototype waarmee iemand kon testen'],
      ['UX Writing', 'UXWR', 'de teksten van een hele flow'],
      ['Toegankelijkheid (WCAG)', 'WCAG', 'een toets met concrete bevindingen'],
      ['Faciliteren', 'FACI', 'een sessie waar een besluit uit komt'],
      ['Presenteren & overtuigen', 'PRES', 'onderzoek dat iets veranderde'],
    ];
    const doelen = [4, 4, 3, 4, 5, 4, 3, 3, 4, 3];
    const staaf = (n, teken) => teken.repeat(n) + '·'.repeat(5 - n);

    return {
      rijen: assen.map(([naam, , anker], i) => {
        const gekozen = this.state.scores[i];
        return {
          naam, anker,
          naamKleur: gekozen ? '#ECE6DF' : '#615D66',
          cellen: [1, 2, 3, 4, 5].map((n) => {
            const aan = gekozen === n;
            return {
              teken: aan ? '■' : '·',
              bg: aan ? '#3DFFD2' : 'transparent',
              fg: aan ? '#0A1512' : '#423F4B',
              rand: aan ? '#3DFFD2' : '#2E2C36',
              kies: () => this.setState({ scores: { ...this.state.scores, [i]: n } }),
            };
          }),
        };
      }),
      balken: assen.map(([, code], i) => ({
        code,
        nu: staaf(this.state.scores[i] || 0, '█'),
        doel: staaf(doelen[i], '░'),
      })),
    };
  }
}
</script>
</body>
</html>
