<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=Space+Grotesk:wght@500;700&family=Space+Mono:wght@400;700&display=swap">
  <style>
    body { margin: 0; font-family: Inter, system-ui, sans-serif; }
    a { color: #3DFFD2; } a:hover { color: #ECE6DF; }
    .stap { cursor: pointer; }
  </style>
</helmet>

<div style="width: 1000px; height: 800px; background: #15141A; color: #ECE6DF; display: flex; flex-direction: column; overflow: hidden;">

  <div style="display: flex; align-items: center; gap: 14px; padding: 14px 32px; border-bottom: 1px solid #2E2C36;">
    <span style="font-family: 'Space Grotesk', sans-serif; font-weight: 700; letter-spacing: -.02em;">COA · UX-team</span>
    <span style="color: #837E76;">·</span>
    <span style="color: #9A958E;">Sanne</span>
    <span style="flex: 1;"></span>
    <span style="width: 7px; height: 7px; border-radius: 50%; background: #3DFFD2; display: inline-block;"></span>
    <span style="font-size: 13px; color: #9A958E;">Bewaard om 14:12</span>
  </div>

  <div style="padding: 28px 32px 20px;">
    <h1 style="margin: 0 0 6px; font-family: 'Space Grotesk', sans-serif; font-size: 27px; font-weight: 700; letter-spacing: -.02em;">Waar sta je, en waar wil je heen?</h1>
    <p style="margin: 0; font-family: 'Space Mono', monospace; font-size: 11px; letter-spacing: .1em; text-transform: uppercase; color: #837E76;">ÉÉN BAAN PER AS &middot; VUL DE BOL VOOR NU, DE RING VOOR JE DOEL</p>
  </div>

  <div style="flex: 1; padding: 0 32px 28px; overflow: hidden; display: flex; flex-direction: column; gap: 18px;">
    <sc-for list="{{assen}}" as="as" hint-placeholder-count="4">
      <div style="border-top: 1px solid #232229; padding-top: 16px;">
        <div style="display: flex; align-items: baseline; gap: 12px; margin-bottom: 4px;">
          <span style="font-family: 'Space Grotesk', sans-serif; font-weight: 700; font-size: 15px;">{{as.naam}}</span>
          <span style="flex: 1;"></span>
          <span style="font-family: 'Space Mono', monospace; font-size: 11px; letter-spacing: .08em; text-transform: uppercase; color: {{as.gatKleur}};">{{as.gatTekst}}</span>
        </div>
        <p style="margin: 0 0 14px; font-size: 13px; color: #837E76;">{{as.anker}}</p>

        <div style="position: relative; display: grid; grid-template-columns: repeat(5, minmax(0, 1fr)); align-items: center; height: 46px;">
          <div style="position: absolute; left: 10%; right: 10%; height: 2px; background: #2E2C36;"></div>
          <div style="position: absolute; left: {{as.gatLinks}}; width: {{as.gatBreed}}; height: 2px; background: #3DFFD2; opacity: .55;"></div>
          <sc-for list="{{as.stappen}}" as="stap" hint-placeholder-count="5">
            <div class="stap" onClick="{{stap.kies}}" style="position: relative; display: grid; place-items: center; height: 46px;">
              <span style="width: {{stap.grootte}}; height: {{stap.grootte}}; border-radius: 50%; background: {{stap.bg}}; border: 2px solid {{stap.rand}}; box-sizing: border-box;"></span>
            </div>
          </sc-for>
        </div>

        <div style="display: grid; grid-template-columns: repeat(5, minmax(0, 1fr)); gap: 4px; margin-top: 2px;">
          <sc-for list="{{as.labels}}" as="lab" hint-placeholder-count="5">
            <span style="text-align: center; font-family: 'Space Mono', monospace; font-size: 9.5px; letter-spacing: .08em; text-transform: uppercase; color: {{lab.kleur}};">{{lab.tekst}}</span>
          </sc-for>
        </div>
      </div>
    </sc-for>

    <div style="margin-top: auto; display: flex; align-items: center; gap: 16px; border-top: 1px solid #232229; padding-top: 18px;">
      <div style="display: flex; align-items: center; gap: 8px; font-family: 'Space Mono', monospace; font-size: 10px; letter-spacing: .1em; text-transform: uppercase; color: #837E76;">
        <span style="width: 12px; height: 12px; border-radius: 50%; background: #3DFFD2;"></span> NU
        <span style="width: 12px; height: 12px; border-radius: 50%; border: 2px solid #E0A83D; box-sizing: border-box; margin-left: 10px;"></span> DOEL
      </div>
      <span style="flex: 1;"></span>
      <span style="font-family: 'Space Mono', monospace; font-size: 11px; letter-spacing: .1em; color: #837E76;">4 VAN 10 ASSEN</span>
      <span style="background: #3DFFD2; color: #0A1512; padding: 9px 18px; border-radius: 10px; font-weight: 600; font-size: 14px;">Volgende drie</span>
    </div>
  </div>
</div>
</x-dc>

<script data-dc-script data-props='{}'>
class Component extends DCLogic {
  constructor(props) {
    super(props);
    this.state = { nu: { 0: 2, 1: 3, 2: 1, 3: 3 }, doel: { 0: 4, 1: 4, 2: 3, 3: 5 }, pak: 'nu' };
  }
  renderVals() {
    const bron = [
      ['Kwalitatief onderzoek', 'een testronde met een handvol deelnemers, van opzet tot terugkoppeling'],
      ['Kwantitatief onderzoek', 'een vragenlijst of een analytics-vraag, van vraag tot conclusie'],
      ['Informatiearchitectuur', 'een navigatiestructuur ontwerpen én toetsen, niet alleen bedenken'],
      ['Interaction Design', 'een flow uitwerken inclusief lege, fout- en laadstates'],
    ];
    const namen = ['Nog niet', 'Meegelopen', 'Met rugdekking', 'Zelfstandig', 'Vraagbaak'];

    return {
      assen: bron.map(([naam, anker], i) => {
        const nu = this.state.nu[i];
        const doel = this.state.doel[i];
        const gat = doel && nu ? doel - nu : null;
        const kolom = (n) => 10 + (n - 1) * 20;
        return {
          naam, anker,
          gatTekst: gat === null ? '—' : gat > 0 ? '+' + gat + ' STAPPEN' : 'BLIJFT GELIJK',
          gatKleur: gat && gat > 0 ? '#E0A83D' : '#615D66',
          gatLinks: gat && gat > 0 ? kolom(nu) + '%' : '0%',
          gatBreed: gat && gat > 0 ? (doel - nu) * 20 + '%' : '0%',
          stappen: [1, 2, 3, 4, 5].map((n) => ({
            grootte: nu === n || doel === n ? '18px' : '9px',
            bg: nu === n ? '#3DFFD2' : 'transparent',
            rand: nu === n ? '#3DFFD2' : doel === n ? '#E0A83D' : '#423F4B',
            kies: () => {
              const veld = this.state.pak === 'nu' ? 'nu' : 'doel';
              this.setState({ [veld]: { ...this.state[veld], [i]: n }, pak: veld === 'nu' ? 'doel' : 'nu' });
            },
          })),
          labels: namen.map((tekst, k) => ({
            tekst,
            kleur: nu === k + 1 ? '#3DFFD2' : doel === k + 1 ? '#E0A83D' : '#615D66',
          })),
        };
      }),
    };
  }
}
</script>
</body>
</html>
